services:
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - rigour-network
    restart: unless-stopped

  geoipupdate:
    container_name: geoipupdate
    image: ghcr.io/maxmind/geoipupdate
    restart: unless-stopped
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${MAXMIND_ACCOUNT_ID}
      - GEOIPUPDATE_LICENSE_KEY=${MAXMIND_LICENSE_KEY}
      - 'GEOIPUPDATE_EDITION_IDS=GeoLite2-ASN GeoLite2-City'
      - GEOIPUPDATE_FREQUENCY=72
    volumes:
      - geoipupdate_data:/usr/share/GeoIP
    networks:
      - rigour-network

  server:
    build:
      context: ./rigour
      dockerfile: Dockerfile
    container_name: rigour-server
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_started
      geoipupdate:
        condition: service_healthy
    command:
      - "--mongo-uri"
      - "mongodb://mongo:27017"
      - "--geoip-path"
      - "/data/geoip"
    volumes:
      - geoipupdate_data:/data/geoip
    networks:
      - rigour-network
    restart: unless-stopped

  ui:
    build:
      context: ./rigour-ui
    container_name: rigour-ui
    depends_on:
      - server
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://server:8080
    networks:
      - rigour-network
    restart: unless-stopped

volumes:
  mongo-data:
  geoipupdate_data:

networks:
  rigour-network:
    driver: bridge
